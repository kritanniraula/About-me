
<!DOCTYPE html>
<html>
<head>

    <title>Will You Date Me? ❤️</title>

    <style>

        body {
            font-family: Arial;
            text-align: center;
            background-color: pink;
            padding-top: 100px;
        }

        .box {
            background-color: white;
            width: 400px;
            margin: auto;
            padding: 30px;
            border-radius: 15px;
        }

        h1 {
            color: #e91e63;
        }

        p {
            color: gray;
            font-size: 18px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }

        #yesBtn {
            background-color: green;
            color: white;
        }

        #noBtn {
            background-color: red;
            color: white;
        }

        #message {
            display: none;
            color: #e91e63;
            font-size: 20px;
            margin-top: 20px;
        }

    </style>

</head>

<body>

    <div class="box">

        <h1>Will You Go on a Date With Me? ❤️</h1>

        <p>
            I have an important question for you... 🥺
        </p>

        <button id="yesBtn">Yes 💖</button>

        <button id="noBtn">No 😭</button>

        <p id="message">
            Yay! 🥰 It's a date! ❤️
        </p>

    </div>


    <script>

        // Get the buttons
        const yesBtn = document.getElementById("yesBtn");
        const noBtn = document.getElementById("noBtn");

        // Get the message
        const message = document.getElementById("message");


        // When Yes is clicked
        yesBtn.addEventListener("click", function() {

            message.style.display = "block";

        });


        // When No is clicked
        noBtn.addEventListener("click", function() {

            alert("Are you sure? 😭❤️");

        });

    </script>

</body>
